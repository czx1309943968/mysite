<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的小站">
<meta name="robots" content="noindex, nofollow">
<title>我的小站</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b1220'/%3E%3Ctext x='90' y='118' font-size='84' text-anchor='middle' fill='%237aa2ff'%3E%E7%AB%99%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4f6fb; --card: #ffffff; --ink: #101828; --muted: #667085;
    --line: #e6eaf2; --accent: #3b6bff; --accent-soft: #eaf0ff;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --danger: #d92d20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --card: #131c2e; --ink: #eaf0ff; --muted: #93a1bd;
      --line: #24314a; --accent: #7aa2ff; --accent-soft: #1b2740;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; line-height: 1.5;
  }
  .hidden { display: none !important; }

  /* ---------- 登录 ---------- */
  #gate { display: flex; flex-direction: column; justify-content: center; min-height: 78vh; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .logo { font-size: 46px; line-height: 1; }
  .brand h1 { font-size: 24px; margin: 10px 0 4px; letter-spacing: -.02em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .login-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px; box-shadow: var(--shadow);
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0 16px; font-size: 13px; color: var(--muted); }
  .row input { width: 18px; height: 18px; accent-color: var(--accent); }
  button {
    width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit;
    font-size: 16px; font-weight: 600; color: #fff; background: var(--accent); cursor: pointer;
  }
  button:disabled { opacity: .6; }
  .err { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 10px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; }

  /* ---------- 内容 ---------- */
  header { margin-bottom: 18px; }
  .hello { font-size: 26px; font-weight: 720; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 14px; font-weight: 650; margin: 0 0 10px; color: var(--muted); letter-spacing: .02em; }
  .todo { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; }
  .todo input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
  .todo span { font-size: 15px; }
  .todo input:checked + span { color: var(--muted); text-decoration: line-through; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px;
    font: inherit; font-size: 15px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .links { display: grid; gap: 8px; }
  .links a {
    display: flex; justify-content: space-between; align-items: center;
    text-decoration: none; color: var(--ink); background: var(--accent-soft);
    padding: 11px 14px; border-radius: 12px; font-size: 15px;
  }
  .links a span:last-child { color: var(--muted); font-size: 13px; }
  .quote { font-size: 16px; line-height: 1.6; }
  .quote::before { content: "“"; color: var(--accent); font-size: 28px; vertical-align: -8px; margin-right: 2px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
  .logout { background: none; color: var(--muted); font-size: 12px; width: auto; padding: 6px 10px; margin: 10px auto 0; display: block; text-decoration: underline; }
</style>
</head>
<body>

<script id="payload" type="application/json">{"v":1,"alg":"AES-256-GCM","iter":210000,"salt":"jpmG9+aY2dvffhXOBI1l0Q==","iv":"jMkW5lFVBJCRoSh4","data":"wrp25Od0hdZzaO71ycMESMst2mFqECN2L0tm0NtfdDUMWZj9G/F5O396yyrC0W4g6N8GnwReUl5xIkZs6ul3WrcS9pin0n7VRvXueGZqiNrJQOSuxDhb/oQVLaLuRJvAtj0EDECwqhqiq1QuKU363pZtwGZp5EE4fvCn8Z0CIsIKccTPB7clEyL644KmIUFsrd6Q2uPCKhJtm/Dy12YN16d1qJ9cU7n37OQDhfrBRmraVsbuhW3deAqjkiSWDfpPL9IumZTJjMFqF3ESUd0Fi02HH0hUlLx/WcAgGfvy4yAI5o13plaLJv/xbfeVEdQZwD2cwyJaEeGcs/DB0Qn8FMwlM77TxytGotB0InXHX4gz5OgXKAsVF9U/AbCduHQvrLoI1LdxNaCYmFaX29saBG96KMADyU44es1g+C8Qh8ZLD0fMAeQcsd3zR4QQ64FPVTti7GJ4/Am78bUORRlg+Bj7aSI5dGvmYNPYJoFFzhKjVviEA1IweyvQOnUU4DXj7oQJGpALOfILI9tGFHb25H5m0lKeADChP5SUL3JAyoyTDcAr5PvQe+Et1Wcez0ACmRh84b8bEGHC+44cVU3bwUtD9c7PJzz1clJ+ACY1wlgSxYYqVmGb5wiTlVI/+vQ2K4KwnFrIHiFY6WmfAZ78sQYYOFKSnvQkcP7hTpJZT1QhL6rkVgdZKS8UpTvimp2rW2ZL3WYZ3rJMfA1+7PTEsHBK4yXBdf7M+VjJCWrQJ4dSSZjxPZAm/O7og159LMgiCuAZoXxLI5sD4PwuXQn7Y+LEAk7OjRiFTHJc4hAUT0Mkb108Bf8cfaCGVKZnVZKw7ERDQwLNJEu+pGPMQ8T8UxdVK4P7gFhjUkyddkAr5mLm2HiRkDVtbqYnw2vpFrL4ZaCnS/n+tC3iegqsT0IR+YZ93NDu3aWkGln+t/ENFF99E2D8XQ=="}</script>

<section id="gate">
  <div class="brand">
    <div class="logo">🐳</div>
    <h1 id="brandTitle">我的小站</h1>
    <p>私人页面 · 需要口令</p>
  </div>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="field">
      <label for="user">用户名</label>
      <input id="user" name="username" type="text" autocomplete="username" placeholder="你的名字">
    </div>
    <div class="field">
      <label for="pass">口令</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="输入口令">
    </div>
    <label class="row"><input id="remember" type="checkbox" checked> 记住这台设备</label>
    <button type="submit" id="submitBtn">进入</button>
    <div class="err" id="err"></div>
  </form>
  <p class="hint">内容已加密存储，口令错误无法查看。</p>
</section>

<section id="app" class="hidden">
  <header>
    <h1 class="hello" id="hello"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>
  <button class="logout" id="logout" type="button">退出登录</button>
</section>

<script>
(function () {
  "use strict";

  var PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  var KEY_CACHE = "mysite.key.v1";
  var KEY_USER = "mysite.user.v1";
  var KEY_TODO = "mysite.todo.v1";
  var KEY_NOTE = "mysite.note.v1";
  var decrypted = null;

  function b64bytes(b64) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function bytesB64(bytes) {
    var s = "", a = new Uint8Array(bytes);
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function b64url(b64) { return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function urlb64(u) {
    u = u.replace(/-/g, "+").replace(/_/g, "/");
    while (u.length % 4) u += "=";
    return u;
  }

  async function deriveKey(password) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64bytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      true,
      ["decrypt"]
    );
  }

  async function decryptWith(key) {
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64bytes(PAYLOAD.iv) },
      key,
      b64bytes(PAYLOAD.data)
    );
    return JSON.parse(new TextDecoder().decode(plain));
  }

  async function unlock(password, remember) {
    var key = await deriveKey(password);
    var content = await decryptWith(key);
    if (remember) {
      try {
        var raw = await crypto.subtle.exportKey("raw", key);
        localStorage.setItem(KEY_CACHE, bytesB64(raw));
      } catch (e) {}
    }
    decrypted = content;
    showApp(content);
  }

  async function tryCached() {
    var cached = localStorage.getItem(KEY_CACHE);
    if (!cached) return false;
    try {
      var key = await crypto.subtle.importKey("raw", b64bytes(cached), { name: "AES-GCM" }, false, ["decrypt"]);
      decrypted = await decryptWith(key);
      showApp(decrypted);
      return true;
    } catch (e) {
      localStorage.removeItem(KEY_CACHE);
      return false;
    }
  }

  function pickGreeting(content) {
    if (content.greeting) return content.greeting;
    var h = new Date().getHours();
    if (h < 6) return "夜深了";
    if (h < 11) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }

  function todayText() {
    var d = new Date();
    var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 星期" + week;
  }

  function loadJSON(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function showApp(content) {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.title = content.appName || "我的小站";
    document.getElementById("hello").textContent = pickGreeting(content) + "，" + (localStorage.getItem(KEY_USER) || "刘哲");
    document.getElementById("sub").textContent = todayText() + " · " + (content.subtitle || "");

    var main = document.getElementById("main");
    main.innerHTML = "";

    (content.cards || []).forEach(function (card) {
      var el = document.createElement("section");
      el.className = "card";
      var h = document.createElement("h2");
      h.textContent = card.title || "";
      el.appendChild(h);

      if (card.type === "todo") {
        var state = loadJSON(KEY_TODO, {});
        (card.items || []).forEach(function (text, i) {
          var row = document.createElement("label");
          row.className = "todo";
          var box = document.createElement("input");
          box.type = "checkbox";
          box.checked = !!state[i];
          box.addEventListener("change", function () {
            var next = loadJSON(KEY_TODO, {});
            next[i] = box.checked;
            saveJSON(KEY_TODO, next);
          });
          var span = document.createElement("span");
          span.textContent = text;
          row.appendChild(box); row.appendChild(span);
          el.appendChild(row);
        });
      }

      if (card.type === "note") {
        var ta = document.createElement("textarea");
        ta.placeholder = card.placeholder || "";
        ta.value = loadJSON(KEY_NOTE, "");
        ta.addEventListener("input", function () { saveJSON(KEY_NOTE, ta.value); });
        el.appendChild(ta);
      }

      if (card.type === "links") {
        var wrap = document.createElement("div");
        wrap.className = "links";
        (card.links || []).forEach(function (link) {
          var a = document.createElement("a");
          a.href = link.url; a.target = "_blank"; a.rel = "noopener";
          var l = document.createElement("span"); l.textContent = link.label;
          var r = document.createElement("span"); r.textContent = link.hint || "打开";
          a.appendChild(l); a.appendChild(r);
          wrap.appendChild(a);
        });
        el.appendChild(wrap);
      }

      if (card.type === "quote") {
        var q = document.createElement("div");
        q.className = "quote";
        q.textContent = content.quote || "";
        el.appendChild(q);
      }

      main.appendChild(el);
    });

    var footer = document.getElementById("footer");
    footer.innerHTML = "私人页面";
    var badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = content.version || "";
    footer.appendChild(badge);
  }

  document.getElementById("loginForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("submitBtn");
    var err = document.getElementById("err");
    var user = document.getElementById("user").value.trim();
    var pass = document.getElementById("pass").value;
    if (!pass) { err.textContent = "请输入口令"; return; }
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "验证中…";
    if (user) localStorage.setItem(KEY_USER, user);
    try {
      await unlock(pass, document.getElementById("remember").checked);
    } catch (e) {
      err.textContent = "口令不对，或页面已更新，请重试。";
      localStorage.removeItem(KEY_CACHE);
    } finally {
      btn.disabled = false;
      btn.textContent = "进入";
    }
  });

  document.getElementById("logout").addEventListener("click", function () {
    localStorage.removeItem(KEY_CACHE);
    location.reload();
  });

  document.getElementById("user").value = localStorage.getItem(KEY_USER) || "";

  if (localStorage.getItem(KEY_CACHE)) {
    document.getElementById("gate").classList.add("hidden");
  }
  tryCached().then(function (ok) {
    if (!ok) document.getElementById("gate").classList.remove("hidden");
  });
})();
</script>
</body>
</html>
