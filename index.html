<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的小站">
<title>我的小站</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b1220'/%3E%3Ctext x='90' y='118' font-size='84' text-anchor='middle' fill='%237aa2ff'%3E%E7%AB%99%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4f6fb; --card: #ffffff; --ink: #101828; --muted: #667085;
    --line: #e6eaf2; --accent: #3b6bff; --accent-soft: #eaf0ff;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --card: #131c2e; --ink: #eaf0ff; --muted: #93a1bd;
      --line: #24314a; --accent: #7aa2ff; --accent-soft: #1b2740;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; line-height: 1.5;
    transition: background .2s ease;
  }
  header { margin-bottom: 18px; }
  .hello { font-size: 26px; font-weight: 720; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 14px; font-weight: 650; margin: 0 0 10px; color: var(--muted); letter-spacing: .02em; }
  .todo { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; }
  .todo input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
  .todo span { font-size: 15px; }
  .todo input:checked + span { color: var(--muted); text-decoration: line-through; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px;
    font: inherit; font-size: 15px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .links { display: grid; gap: 8px; }
  .links a {
    display: flex; justify-content: space-between; align-items: center;
    text-decoration: none; color: var(--ink); background: var(--accent-soft);
    padding: 11px 14px; border-radius: 12px; font-size: 15px;
  }
  .links a span:last-child { color: var(--muted); font-size: 13px; }
  .quote { font-size: 16px; line-height: 1.6; }
  .quote::before { content: "“"; color: var(--accent); font-size: 28px; vertical-align: -8px; margin-right: 2px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px;
  }
</style>
</head>
<body>
  <header>
    <h1 class="hello" id="hello"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>

<script>
/* ============================================================
   页面内容都在下面这个 CONTENT 对象里。
   要改字、改列表、改链接、加卡片，只改这里就行。
   ============================================================ */
const CONTENT = {
  appName: "我的小站",
  version: "v1 · 2026-11-21",
  greeting: "下午好",              // 留空则按时间自动判断
  subtitle: "这是你的私人页面，内容我说了算，你说了更算。",
  quote: "把复杂的事拆开，一件一件做。",
  cards: [
    { type: "todo",  title: "今日三件事", items: ["把手机页面跑起来", "想清楚这页要用来干嘛", "告诉我第一处要改的地方"] },
    { type: "note",  title: "随手记", placeholder: "想到什么写什么，只存在这台手机上…" },
    { type: "links", title: "快捷入口", links: [
        { label: "DeepSeek", url: "https://chat.deepseek.com", hint: "网页版" },
        { label: "百度",     url: "https://www.baidu.com",     hint: "搜索" }
    ]},
    { type: "quote", title: "今日一句" }
  ]
};

/* ---------------- 渲染 ---------------- */
const KEY_TODO = "mysite.todo.v1";
const KEY_NOTE = "mysite.note.v1";

function pickGreeting() {
  if (CONTENT.greeting) return CONTENT.greeting;
  const h = new Date().getHours();
  if (h < 6) return "夜深了";
  if (h < 11) return "早上好";
  if (h < 14) return "中午好";
  if (h < 18) return "下午好";
  return "晚上好";
}

function todayText() {
  const d = new Date();
  const week = ["日","一","二","三","四","五","六"][d.getDay()];
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 星期" + week;
}

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function render() {
  document.title = CONTENT.appName;
  document.getElementById("hello").textContent = pickGreeting() + "，刘哲";
  document.getElementById("sub").textContent = todayText() + " · " + CONTENT.subtitle;
  const main = document.getElementById("main");
  main.innerHTML = "";

  for (const card of CONTENT.cards) {
    const el = document.createElement("section");
    el.className = "card";
    const h = document.createElement("h2");
    h.textContent = card.title;
    el.appendChild(h);

    if (card.type === "todo") {
      const state = loadJSON(KEY_TODO, {});
      card.items.forEach((text, i) => {
        const row = document.createElement("label");
        row.className = "todo";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!state[i];
        box.addEventListener("change", () => {
          const next = loadJSON(KEY_TODO, {});
          next[i] = box.checked;
          saveJSON(KEY_TODO, next);
        });
        const span = document.createElement("span");
        span.textContent = text;
        row.appendChild(box); row.appendChild(span);
        el.appendChild(row);
      });
    }

    if (card.type === "note") {
      const ta = document.createElement("textarea");
      ta.placeholder = card.placeholder || "";
      ta.value = loadJSON(KEY_NOTE, "");
      ta.addEventListener("input", () => saveJSON(KEY_NOTE, ta.value));
      el.appendChild(ta);
    }

    if (card.type === "links") {
      const wrap = document.createElement("div");
      wrap.className = "links";
      (card.links || []).forEach((link) => {
        const a = document.createElement("a");
        a.href = link.url; a.target = "_blank"; a.rel = "noopener";
        const l = document.createElement("span"); l.textContent = link.label;
        const r = document.createElement("span"); r.textContent = link.hint || "打开";
        a.appendChild(l); a.appendChild(r);
        wrap.appendChild(a);
      });
      el.appendChild(wrap);
    }

    if (card.type === "quote") {
      const q = document.createElement("div");
      q.className = "quote";
      q.textContent = CONTENT.quote;
      el.appendChild(q);
    }

    main.appendChild(el);
  }

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = CONTENT.version;
  document.getElementById("footer").innerHTML = "由 DSH 维护";
  document.getElementById("footer").appendChild(badge);
}

render();
</script>
</body>
</html>
