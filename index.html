<!DOCTYPE html>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e5e7eb'/%3E%3Ccircle cx='90' cy='90' r='32' fill='none' stroke='%236b7280' stroke-width='8'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #e8efff;
    --ok: #2f9e44; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --ink: #e6e8eb; --muted: #9aa4b2;
      --line: #2a2f3a; --accent: #6ea8fe; --accent-soft: #1d2735;
      --ok: #51cf66; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  html, body {
    margin: 0; padding: 0;
    -webkit-user-select: none; -moz-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea, select {
    -webkit-user-select: text; -moz-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }
  button, a, label, .item, .recipe, .picked-chip {
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }

  /* 登录后切到暖色调，登录页保持中性 */
  body.app-mode {
    --bg: #fff8f1; --card: #fffdfb; --ink: #2a1c12; --muted: #8b7360;
    --line: #f3e4d6; --accent: #e8590c; --accent-soft: #ffe9db;
    --ok: #3f9d4f; --header-bg: rgba(255,248,241,.88);
    --avatar-bg: #ffe1ea; --avatar-ink: #d6336c;
    --shadow: 0 1px 2px rgba(90,50,20,.05), 0 10px 28px rgba(90,50,20,.07);
    background:
      radial-gradient(1100px 380px at 50% -8%, #ffe9d6 0%, rgba(255,233,214,0) 62%),
      var(--bg);
    padding-top: 0;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    body.app-mode {
      --bg: #17110d; --card: #241a14; --ink: #fbeee6; --muted: #b39c8c;
      --line: #3a2b22; --accent: #ff8a4c; --accent-soft: #3a2318;
      --ok: #51cf66; --header-bg: rgba(23,17,13,.9);
      --avatar-bg: #40202c; --avatar-ink: #ff9ec0;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      background:
        radial-gradient(1100px 380px at 50% -8%, #2a1a10 0%, rgba(42,26,16,0) 62%),
        var(--bg);
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    padding: calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    max-width: 600px; margin: 0 auto; line-height: 1.5;
  }
  .hidden { display: none !important; }

  /* ---------- 登录 ---------- */
  #gate { display: flex; flex-direction: column; justify-content: center; min-height: 78vh; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .logo { font-size: 46px; line-height: 1; }
  .brand h1 { font-size: 24px; margin: 10px 0 4px; letter-spacing: -.02em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0 16px; font-size: 13px; color: var(--muted); }
  .row input { width: 18px; height: 18px; accent-color: var(--accent); }
  button {
    width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit;
    font-size: 16px; font-weight: 600; color: #fff; background: var(--accent); cursor: pointer;
  }
  button:disabled { opacity: .6; }
  .err { color: #d92d20; font-size: 13px; min-height: 20px; margin-top: 10px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; }

  /* ---------- 主界面 ---------- */
  .bless-row { display: flex; align-items: center; gap: 8px; }
  .bless-row .bless { flex: 1; min-width: 0; }
  .edit-trigger {
    position: relative; flex: none; width: 34px; height: 32px; padding: 0;
    border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
    background: var(--accent-soft); color: var(--accent); font-size: 17px; line-height: 1;
  }
  .edit-trigger::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: var(--accent); opacity: .28;
    transform: scaleX(0); transform-origin: left; transition: transform 3s linear;
  }
  .edit-trigger.holding::after { transform: scaleX(1); }
  .edit-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent-soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 10px; margin-bottom: 10px;
  }
  .edit-bar .edit-label { font-size: 13px; font-weight: 700; color: var(--accent); }
  .edit-bar .edit-hint { flex: 1; font-size: 11px; color: var(--muted); }
  .mini.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mini.ghost { background: var(--card); color: var(--muted); }
  .mini.danger { background: transparent; color: #d92d20; border-color: #f3c7c2; }
  .edit-input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 14px; outline: none;
  }
  .edit-input:focus { border-color: var(--accent); }
  .name-input { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; }
  .ing-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .ing-row .ing-name { flex: 2; min-width: 0; }
  .ing-row .ing-qty { flex: 1; min-width: 0; }
  .cat-select {
    flex: none; width: 62px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 8px; padding: 7px 4px; font: inherit; font-size: 12px; outline: none;
  }
  .ing-del {
    flex: none; width: 26px; height: 28px; padding: 0; border-radius: 7px;
    background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 15px;
  }
  .add-ing { margin: 2px 0 12px; }
  .steps-area {
    width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: 14px; line-height: 1.6; outline: none;
  }
  .steps-area:focus { border-color: var(--accent); }
  .edit-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .edit-emoji { font-size: 20px; line-height: 1; }
  .edit-name { font-size: 15px; font-weight: 700; }
  .edit-sub { flex: 1; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edit-head .chev { color: var(--muted); font-size: 12px; flex: none; }
  .edit-body { margin-top: 12px; }
  .mini.danger.armed { background: #d92d20; color: #fff; border-color: #d92d20; }
  .edit-card h2 { font-size: 13px; font-weight: 650; color: var(--muted); margin: 12px 0 6px; }
  .add-recipe { width: 100%; margin: 12px 0 8px; }
  .top-fixed {
    position: sticky; top: 0; z-index: 40;
    margin: 0 -14px 8px;
    padding: calc(4px + env(safe-area-inset-top)) 14px 6px;
    background: var(--header-bg);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  header { padding: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .who { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    background: var(--avatar-bg); color: var(--avatar-ink);
    font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .who .name { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .greet { margin-bottom: 1px; }
  .hello { font-size: 17px; font-weight: 750; letter-spacing: -.01em; margin: 0 0 2px; }
  .bless {
    margin: 0; font-size: 11px; color: var(--muted); line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .bless::before { content: "“"; color: var(--accent); margin-right: 1px; }

  .tabs { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 14px; }
  .tabs button {
    width: auto; flex: 1; background: transparent; color: var(--muted); font-size: 15px;
    font-weight: 600; padding: 10px; border-radius: 10px;
  }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); }
  .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; }
  .count.soft { background: var(--accent-soft); color: var(--accent); }
  .tabs button.active .count.soft { background: var(--accent); color: #fff; }

  /* 菜谱卡片 */
  .recipe { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .r-head { display: flex; align-items: center; gap: 12px; }
  .r-emoji { font-size: 28px; line-height: 1; }
  .r-title { flex: 1; min-width: 0; }
  .r-title h2 { font-size: 17px; margin: 0; font-weight: 700; }
  .r-title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .pick {
    width: auto; flex: none; font-size: 13px; font-weight: 600; padding: 8px 12px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  }
  .pick.on { background: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); padding: 3px 9px; border-radius: 999px; }
  .r-head { cursor: pointer; }
  .r-chev { flex: none; color: var(--muted); font-size: 12px; margin-right: 2px; }
  .r-body { margin-top: 10px; }
  .r-body h2 { font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: .02em; margin: 10px 0 6px; }
  .r-body ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
  .r-body li { margin-bottom: 5px; }
  .recipe.open { box-shadow: 0 2px 6px rgba(90,50,20,.08), 0 12px 32px rgba(90,50,20,.08); }
  details { margin-top: 10px; }
  summary { font-size: 13px; color: var(--accent); cursor: pointer; }
  details ol { margin: 10px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink); }
  details li { margin-bottom: 6px; }

  /* 购物清单 */
  .picked { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .picked .label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .picked-chip {
    width: auto; display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 7px 11px 7px 12px; font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow);
  }
  .picked-chip .x { color: var(--muted); font-size: 15px; line-height: 1; }
  .picked-empty { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .summary-bar { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .progress { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .25s ease; }
  .summary-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .summary-row b { color: var(--ink); font-size: 15px; }
  .mini {
    width: auto; padding: 5px 10px; font-size: 12px; font-weight: 600; border-radius: 999px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
  .group { margin-bottom: 10px; }
  .group h3 { font-size: 12px; color: var(--muted); font-weight: 650; margin: 0 0 6px 4px; letter-spacing: .03em; }
  .item {
    display: flex; align-items: center; gap: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; margin-bottom: 4px;
  }
  .item input { width: 19px; height: 19px; accent-color: var(--ok); flex: none; }
  .item .name { flex: 1; font-size: 14px; }
  .item .qty { font-size: 12px; color: var(--muted); }
  .item.done .name { color: var(--muted); text-decoration: line-through; }
  .item.done { background: var(--bg); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty button { width: auto; margin-top: 12px; padding: 9px 18px; font-size: 14px; }
  .done-wrap { display: flex; justify-content: flex-end; margin: 18px 2px 10px; }
  .done-btn {
    width: auto; padding: 12px 22px; font-size: 15px; font-weight: 700;
    border-radius: 999px; background: var(--accent); color: #fff;
    box-shadow: var(--shadow);
  }
  /* 二次确认弹窗 */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(15,23,42,.45);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    animation: maskIn .16s ease;
  }
  .modal {
    width: 100%; max-width: 320px; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 20px 18px 14px; box-shadow: 0 20px 50px rgba(15,23,42,.28);
    animation: modalIn .18s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal h3 { margin: 0 0 6px; font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
  .modal p { margin: 0 0 16px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .modal p b { color: var(--ink); font-weight: 650; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 11px; font-size: 15px; font-weight: 650; border-radius: 12px; }
  .modal-cancel { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .modal-ok { background: var(--ok); color: #fff; }
  @keyframes maskIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.96) } to { opacity: 1; transform: none } }
  .toast {
    position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    background: rgba(30,20,12,.92); color: #fff; font-size: 13px; line-height: 1.4;
    padding: 9px 14px; border-radius: 12px; max-width: 82vw; text-align: center;
    transition: opacity .2s ease, transform .2s ease; z-index: 120;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
  .logout {
    position: fixed; left: calc(12px + env(safe-area-inset-left));
    bottom: calc(12px + env(safe-area-inset-bottom));
    width: auto; margin: 0; padding: 8px 13px; display: inline-block;
    font-size: 12px; font-weight: 600; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: var(--shadow); text-decoration: none; opacity: .92; z-index: 20;
  }
</style>
</head>

<section id="gate">
  <div class="brand">
    <div class="logo">&#128274;</div>
    <h1 id="brandTitle">私人空间</h1>
    <p>请输入口令以继续</p>
  </div>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="field">
      <label for="user">用户名</label>
      <input id="user" name="username" type="text" autocomplete="username" placeholder="你的名字">
    </div>
    <div class="field">
      <label for="pass">口令</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="输入口令">
    </div>
    <label class="row"><input id="remember" type="checkbox" checked> 记住这台设备</label>
    <button type="submit" id="submitBtn">进入</button>
    <div class="err" id="err"></div>
  </form>
  <p class="hint">内容已加密存储，口令错误无法查看。</p>
</section>

<section id="app" class="hidden">
  <div class="top-fixed">
  <header>
    <div class="topbar">
      <div class="who">
        <span class="avatar" id="avatar">刘</span>
        <span class="name" id="userName">刘哲</span>
      </div>
      <div class="when" id="clock"></div>
    </div>
    <div class="greet">
      <h1 class="hello" id="hello"></h1>
      <div class="bless-row">
        <p class="bless" id="bless"></p>
        <button class="edit-trigger" id="editTrigger" type="button" aria-label="长按 3 秒进入编辑">✎</button>
      </div>
    </div>
  </header>

  <div class="edit-bar hidden" id="editBar">
    <span class="edit-label">编辑模式</span>
    <span class="edit-hint">改完点保存</span>
    <button class="mini ghost" id="btnCancelEdit" type="button">撤回</button>
    <button class="mini primary" id="btnSaveEdit" type="button">保存</button>
  </div>

  <nav class="tabs">
    <button id="tabRecipes" class="active" type="button">菜谱<span class="count soft" id="recipeCount"></span></button>
    <button id="tabShop" type="button">买菜清单<span class="count hidden" id="shopCount"></span></button>
  </nav>
  </div>

  <main id="view"></main>

  <footer id="footer"></footer>
  <button class="logout" id="logout" type="button">退出登录</button>
</section>

<script>
(function () {
  "use strict";

  var PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  var KEY_CACHE = "mysite.key.v1";
  var KEY_USER = "mysite.user.v1";
  var SEL_KEY = "mysite.sel.v1";
  var CHK_KEY = "mysite.chk.v1";
  var CAT_ORDER = ["蔬菜", "肉蛋", "调料", "其他"];
  var CAT_EMOJI = { "蔬菜": "🥬", "肉蛋": "🥩", "调料": "🧂", "其他": "🛒" };
  var content = null;
  var currentTab = "recipes";
  var RECIPES_KEY = "mysite.recipes.v1";
  var PENDING_KEY = "mysite.pending.v1";
  var editing = false;
  var editOpen = -1;
  var openRecipe = null;
  var draft = null;
  var remoteRecipes = null;
  var sessionKey = null;

  function recipes() {
    if (remoteRecipes && remoteRecipes.length) return remoteRecipes;
    var saved = loadJSON(RECIPES_KEY, null);
    if (saved && saved.length) return saved;
    return (content && content.recipes) ? content.recipes : [];
  }

  /* 从云端 data.json 读取菜谱（已用同一口令加密） */
  async function loadRemoteRecipes(key) {
    if (!sessionKey) sessionKey = key;
    var local = loadJSON(RECIPES_KEY, null);
    try {
      var res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      var d = await res.json();
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64bytes(d.iv) }, key, b64bytes(d.data));
      var obj = JSON.parse(new TextDecoder().decode(plain));
      if (!obj || !obj.recipes || !obj.recipes.length) return;

      // 只有"上次保存失败"留下的本机改动才优先；否则以云端为准，避免旧缓存覆盖云端
      var pending = loadJSON(PENDING_KEY, false);
      if (pending && local && local.length && JSON.stringify(local) !== JSON.stringify(obj.recipes)) {
        remoteRecipes = local;
        toast("检测到本机有未同步的改动，点保存即可上传");
        return;
      }
      remoteRecipes = obj.recipes;
      saveJSON(RECIPES_KEY, remoteRecipes);
    } catch (e) {
      console.warn("remote recipes unavailable:", e);
    }
  }

  /* 把菜谱加密后写回 GitHub 仓库 */
  /* 带超时的 fetch：网络卡住时不会一直转圈 */
  function fetchTimeout(url, opts, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    var o = Object.assign({}, opts || {}, { signal: ctrl.signal });
    return fetch(url, o).then(function (r) { clearTimeout(timer); return r; },
      function (e) { clearTimeout(timer); throw e; });
  }

  async function pushRecipes(list) {
    var repo = content.editRepo;
    var token = content.editToken;
    if (!repo || !token) throw new Error("页面没有云端写入凭据");
    if (!sessionKey) throw new Error("会话密钥已失效，请重新登录");

    var iv = crypto.getRandomValues(new Uint8Array(12));
    var enc = new TextEncoder();
    var buf = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: iv },
      sessionKey,
      enc.encode(JSON.stringify({ recipes: list }))
    );
    var payload = {
      v: 1, alg: "AES-256-GCM", iter: PAYLOAD.iter, salt: PAYLOAD.salt,
      iv: bytesB64(iv), data: bytesB64(buf)
    };
    var json = JSON.stringify(payload);

    var api = "https://api.github.com/repos/" + repo + "/contents/data.json";
    var auth = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };

    var sha = null;
    try {
      var got = await fetchTimeout(api + "?t=" + Date.now(), { headers: auth, cache: "no-store" }, 12000);
      if (got.ok) {
        var meta = await got.json();
        sha = meta.sha;
      }
    } catch (e) {
      throw new Error("连不上 GitHub（读取超时）");
    }

    var body = {
      message: "update recipes " + new Date().toISOString(),
      content: btoa(json),
      branch: "main"
    };
    if (sha) body.sha = sha;

    var res;
    try {
      res = await fetchTimeout(api, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
        body: JSON.stringify(body)
      }, 15000);
    } catch (e) {
      throw new Error("连不上 GitHub（上传超时）");
    }
    if (!res.ok) {
      var detail = "";
      try { detail = (await res.json()).message || ""; } catch (e) {}
      throw new Error("HTTP " + res.status + (detail ? " " + detail : ""));
    }
  }

  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  /* ---------- 加解密 ---------- */
  function b64bytes(b64) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function bytesB64(bytes) {
    var s = "", a = new Uint8Array(bytes);
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  async function deriveKey(password) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64bytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
    );
  }
  async function decryptWith(key) {
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64bytes(PAYLOAD.iv) }, key, b64bytes(PAYLOAD.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function tryCached() {
    var cached = localStorage.getItem(KEY_CACHE);
    if (!cached) return false;
    try {
      var key = await crypto.subtle.importKey("raw", b64bytes(cached), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
      content = await decryptWith(key);
      await loadRemoteRecipes(key);
      startApp();
      return true;
    } catch (e) {
      localStorage.removeItem(KEY_CACHE);
      return false;
    }
  }

  /* ---------- 存储 ---------- */
  function loadJSON(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function selected() { return loadJSON(SEL_KEY, {}); }
  function checked() { return loadJSON(CHK_KEY, {}); }
  function selectedIds() {
    var s = selected(), out = [];
    (recipes() || []).forEach(function (r) { if (s[r.id]) out.push(r.id); });
    return out;
  }

  /* ---------- 界面 ---------- */
  function pickGreeting() {
    var h = new Date().getHours();
    if (h < 6) return "夜深了";
    if (h < 11) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }
  function todayText() {
    var d = new Date();
    var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 星期" + week;
  }

  function updateClock() {
    var d = new Date();
    var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    var hh = d.getHours(), mm = d.getMinutes();
    var el = document.getElementById("clock");
    if (!el) return;
    el.textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + week + " " +
      (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
  }

  function pickBlessing(c) {
    var list = (c.blessings && c.blessings.length) ? c.blessings : (c.blessing ? [c.blessing] : [""]);
    var last = parseInt(localStorage.getItem("mysite.bless.v1"), 10);
    var idx = Math.floor(Math.random() * list.length);
    if (list.length > 1 && idx === last) idx = (idx + 1) % list.length;
    try { localStorage.setItem("mysite.bless.v1", String(idx)); } catch (e) {}
    return list[idx];
  }

  function pickRandom(list, fallback) {
    if (!list || !list.length) return fallback || "";
    return list[Math.floor(Math.random() * list.length)];
  }

  var lastHeaderTab = null;
  function updateHeader() {
    if (lastHeaderTab === currentTab) return;
    lastHeaderTab = currentTab;
    var helloEl = document.getElementById("hello");
    var blessEl = document.getElementById("bless");
    if (currentTab === "shop") {
      helloEl.textContent = pickRandom(content.shopTitles, "买菜时间");
      blessEl.textContent = pickRandom(content.shopTips, "");
    } else {
      helloEl.textContent = pickGreeting() + "，想吃点什么？";
      blessEl.textContent = pickBlessing(content);
    }
  }

  function startApp() {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.body.classList.add("app-mode");
    document.title = content.appName || "私人空间";
    var name = localStorage.getItem(KEY_USER) || "访客";
    document.getElementById("userName").textContent = name;
    document.getElementById("avatar").textContent = "🥢";
    updateClock();
    if (!startApp.clockTimer) startApp.clockTimer = setInterval(updateClock, 15000);
    render();
  }

  function render() {
    updateHeader();
    document.getElementById("tabRecipes").classList.toggle("active", currentTab === "recipes");
    document.getElementById("tabShop").classList.toggle("active", currentTab === "shop");

    var n = selectedIds().length;
    var badge = document.getElementById("shopCount");
    badge.textContent = n ? String(n) : "";
    badge.classList.toggle("hidden", n === 0);

    var recipeBadge = document.getElementById("recipeCount");
    if (recipeBadge) {
      var total = (content && content.recipes) ? content.recipes.length : 0;
      recipeBadge.textContent = total ? String(total) : "";
      recipeBadge.classList.toggle("hidden", total === 0);
    }

    var view = document.getElementById("view");
    view.innerHTML = "";
    if (editing) { renderEditor(view); return; }
    if (currentTab === "recipes") renderRecipes(view);

  function shoppingList() {
    var sel = selected();
    var map = {};
    (recipes() || []).forEach(function (r) {
      if (!sel[r.id]) return;
      (r.ingredients || []).forEach(function (ing) {
        var key = (ing.cat || "其他") + "|" + ing.name;
        if (!map[key]) map[key] = { key: key, name: ing.name, cat: ing.cat || "其他", qtys: [] };
        if (ing.qty && map[key].qtys.indexOf(ing.qty) < 0) map[key].qtys.push(ing.qty);
      });
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  function pruneChecks() {
    var keys = {};
    shoppingList().forEach(function (it) { keys[it.key] = true; });
    var c = checked(), changed = false;
    Object.keys(c).forEach(function (k) { if (!keys[k]) { delete c[k]; changed = true; } });
    if (changed) saveJSON(CHK_KEY, c);
  }

  function removeRecipe(id) {
    var s = selected();
    delete s[id];
    saveJSON(SEL_KEY, s);
    pruneChecks();
    render();
  }

    var items = shoppingList();

    var bought = items.filter(function (it) { return chk[it.key]; }).length;

    var row = document.createElement("div");

        lines.push("【" + cat + "】");

      });
      var text = lines.join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {

        });

    });
    actions.appendChild(copy);

    var reset = document.createElement("button");
    reset.className = "mini"; reset.type = "button"; reset.textContent = "清空勾选";
    reset.style.marginLeft = "6px";
    reset.addEventListener("click", function () { saveJSON(CHK_KEY, {}); render(); });
    actions.appendChild(reset);

    row.appendChild(txt); row.appendChild(actions);
    bar.appendChild(row);
    view.appendChild(bar);

    CAT_ORDER.concat(["其他"]).forEach(function (cat) {
      var group = items.filter(function (it) { return it.cat === cat; });
      if (!group.length) return;
      var g = document.createElement("div");
      g.className = "group";
      var h3 = document.createElement("h3");
      h3.textContent = (CAT_EMOJI[cat] || "") + " " + cat;
      g.appendChild(h3);

      group.forEach(function (it) {
        var label = document.createElement("label");
        label.className = "item" + (chk[it.key] ? " done" : "");

        var box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!chk[it.key];
        box.addEventListener("change", function () {
          var c = checked();
          if (box.checked) c[it.key] = true; else delete c[it.key];
          saveJSON(CHK_KEY, c);
          render();
        });

        var name = document.createElement("span");
        name.className = "name"; name.textContent = it.name;

        var qty = document.createElement("span");
        qty.className = "qty"; qty.textContent = it.qtys.join("、");

        label.appendChild(box); label.appendChild(name); label.appendChild(qty);
        g.appendChild(label);
      });
      view.appendChild(g);
    });

    // 右下角「已完成」：先弹窗二次确认，点「确定完成」才清空
    var doneWrap = document.createElement("div");
    doneWrap.className = "done-wrap";
    var doneBtn = document.createElement("button");
    doneBtn.type = "button";
    doneBtn.className = "done-btn";
    doneBtn.textContent = "✓ 已完成";
    doneBtn.addEventListener("click", function () {
      openDoneConfirm(selectedIds().length, Object.keys(checked()).length);
    });
    doneWrap.appendChild(doneBtn);
    view.appendChild(doneWrap);

  /* ---------- 二次确认弹窗 ---------- */
  function openDoneConfirm(recipeCount, itemCount) {
    var mask = document.createElement("div");
    mask.className = "modal-mask";

    var box = document.createElement("div");
    box.className = "modal";
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.setAttribute("aria-label", "确认清空");

    var title = document.createElement("h3");
    title.textContent = "确定已完成？";

    var desc = document.createElement("p");
    var parts = [];
    if (recipeCount) parts.push("<b>" + recipeCount + "</b> 道菜谱");
    if (itemCount) parts.push("<b>" + itemCount + "</b> 项已买的食材");
    desc.innerHTML = parts.length
      ? "将清空选中的 " + parts.join("和") + "，清空后不可恢复。"
      : "当前还没有选菜谱或勾选食材，确定要清空吗？";

    var acts = document.createElement("div");
    acts.className = "modal-actions";

    var cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "modal-cancel";
    cancel.textContent = "先不清空";

    var ok = document.createElement("button");
    ok.type = "button";
    ok.className = "modal-ok";
    ok.textContent = "确定完成";

    cancel.addEventListener("click", function (ev) { ev.stopPropagation(); close(); });
    ok.addEventListener("click", function (ev) {
      ev.stopPropagation();
      saveJSON(SEL_KEY, {});
      saveJSON(CHK_KEY, {});
      close();
      render();
    });
    mask.addEventListener("click", function (ev) { if (ev.target === mask) close(); });
    document.addEventListener("keydown", onKey);

    function onKey(ev) { if (ev.key === "Escape") close(); }
    function close() {
      document.removeEventListener("keydown", onKey);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
    }

    acts.appendChild(cancel);
    acts.appendChild(ok);
    box.appendChild(title);
    box.appendChild(desc);
    box.appendChild(acts);
    mask.appendChild(box);
    document.body.appendChild(mask);
    ok.focus();
  }

  /* ---------- 编辑模式 ---------- */

  function enterEditMode() {
    if (editing) return;
    editing = true;
    editOpen = -1;
    draft = JSON.parse(JSON.stringify(recipes()));
    document.getElementById("editBar").classList.remove("hidden");
    document.getElementById("tabRecipes").disabled = true;
    document.getElementById("tabShop").disabled = true;
    currentTab = "recipes";
    lastHeaderTab = null;
    render();
    window.scrollTo(0, 0);
  }

  function exitEditMode() {
    editing = false;
    editOpen = -1;
    draft = null;
    document.getElementById("editBar").classList.add("hidden");
    document.getElementById("tabRecipes").disabled = false;
    document.getElementById("tabShop").disabled = false;
  }

  async function saveEdits() {
    var clean = [];
    (draft || []).forEach(function (r) {
      var nm = (r.name || "").trim();
      if (!nm) return;
      clean.push({
        id: r.id || ("r" + Math.random().toString(36).slice(2, 8)),
        name: nm,
        emoji: r.emoji || "🍽",
        meta: r.meta || "",
        ingredients: (r.ingredients || []).filter(function (i) { return (i.name || "").trim(); }),
        steps: (r.steps || []).filter(function (s) { return s; })
      });
    });
    if (!clean.length) { toast("至少要留一道有名字的菜"); return; }

    var btn = document.getElementById("btnSaveEdit");
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "保存中…";
    remoteRecipes = clean;
    saveJSON(RECIPES_KEY, clean);
    try {
      await pushRecipes(clean);
      saveJSON(PENDING_KEY, false);
      toast("已保存到云端，其他设备约 1 分钟后可见");
      exitEditMode();
      render();
      return;
    } catch (e) {
      saveJSON(PENDING_KEY, true);
      toast("保存失败：" + e.message + "（改动已存本机，可再点一次保存重试）");
    } finally {
      // 无论成功失败都恢复按钮，避免卡在"保存中"
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  function cancelEdits() {
    exitEditMode();
    render();
  }

        }
        clearTimeout(timer);
        draft.splice(ri, 1);
        editOpen = -1;
        render();
      });
      body.appendChild(del);

      card.appendChild(body);
      view.appendChild(card);
    });

    var addCard = document.createElement("button");
    addCard.type = "button";
    addCard.className = "done-btn add-recipe";
    addCard.textContent = "＋ 新增菜谱";
    addCard.addEventListener("click", function () {
      draft.push({ id: "r" + Date.now(), name: "", emoji: "🍽", meta: "", ingredients: [], steps: [] });
      editOpen = draft.length - 1;
      render();
    });
    view.appendChild(addCard);
  }

  function wireEditTrigger() {
    var el = document.getElementById("editTrigger");
    if (!el) return;
    var timer = null;
    function start(ev) {
      if (editing) return;
      ev.preventDefault();
      el.classList.add("holding");
      timer = setTimeout(function () {
        el.classList.remove("holding");
        enterEditMode();
      }, 3000);
    }
    function stop() {
      clearTimeout(timer);
      el.classList.remove("holding");
    }
    el.addEventListener("pointerdown", start);
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointerleave", stop);
    el.addEventListener("pointercancel", stop);
    el.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  }

  /* ---------- 事件 ---------- */
  document.getElementById("btnSaveEdit").addEventListener("click", saveEdits);
  document.getElementById("btnCancelEdit").addEventListener("click", cancelEdits);
  wireEditTrigger();
  document.getElementById("tabRecipes").addEventListener("click", function () { currentTab = "recipes"; render(); });
  document.getElementById("tabShop").addEventListener("click", function () { currentTab = "shop"; render(); });

  document.getElementById("loginForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("submitBtn");
    var err = document.getElementById("err");
    var user = document.getElementById("user").value.trim();
    var pass = document.getElementById("pass").value;
    if (!pass) { err.textContent = "请输入口令"; return; }
    err.textContent = "";
    btn.disabled = true; btn.textContent = "验证中…";
    if (user) localStorage.setItem(KEY_USER, user);
    try {
      var key = await deriveKey(pass);
      content = await decryptWith(key);
      await loadRemoteRecipes(key);
      if (document.getElementById("remember").checked) {
        try {
          var raw = await crypto.subtle.exportKey("raw", key);
          localStorage.setItem(KEY_CACHE, bytesB64(raw));
        } catch (e) {}
      }
      startApp();
    } catch (e) {
      err.textContent = "口令不对，或页面已更新，请重试。";
      localStorage.removeItem(KEY_CACHE);
    } finally {
      btn.disabled = false; btn.textContent = "进入";
    }
  });

  document.getElementById("logout").addEventListener("click", function () {
    localStorage.removeItem(KEY_CACHE);
    location.reload();
  });

  document.getElementById("user").value = localStorage.getItem(KEY_USER) || "";
  if (localStorage.getItem(KEY_CACHE)) document.getElementById("gate").classList.add("hidden");
  tryCached().then(function (ok) { if (!ok) document.getElementById("gate").classList.remove("hidden"); });
})();
</script>
</body>
