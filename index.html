<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="私人空间">
<meta name="robots" content="noindex, nofollow">
<title>私人空间</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e5e7eb'/%3E%3Ccircle cx='90' cy='90' r='32' fill='none' stroke='%236b7280' stroke-width='8'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #e8efff;
    --ok: #2f9e44; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --ink: #e6e8eb; --muted: #9aa4b2;
      --line: #2a2f3a; --accent: #6ea8fe; --accent-soft: #1d2735;
      --ok: #51cf66; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  html, body {
    margin: 0; padding: 0;
    -webkit-user-select: none; -moz-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea, select {
    -webkit-user-select: text; -moz-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }
  button, a, label, .item, .recipe, .picked-chip {
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }

  /* 登录后切到暖色调，登录页保持中性 */
  body.app-mode {
    --bg: #fff8f1; --card: #fffdfb; --ink: #2a1c12; --muted: #8b7360;
    --line: #f3e4d6; --accent: #e8590c; --accent-soft: #ffe9db;
    --ok: #3f9d4f; --header-bg: rgba(255,248,241,.88);
    --avatar-bg: #ffe1ea; --avatar-ink: #d6336c;
    --shadow: 0 1px 2px rgba(90,50,20,.05), 0 10px 28px rgba(90,50,20,.07);
    background:
      radial-gradient(1100px 380px at 50% -8%, #ffe9d6 0%, rgba(255,233,214,0) 62%),
      var(--bg);
    padding-top: 0;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    body.app-mode {
      --bg: #17110d; --card: #241a14; --ink: #fbeee6; --muted: #b39c8c;
      --line: #3a2b22; --accent: #ff8a4c; --accent-soft: #3a2318;
      --ok: #51cf66; --header-bg: rgba(23,17,13,.9);
      --avatar-bg: #40202c; --avatar-ink: #ff9ec0;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      background:
        radial-gradient(1100px 380px at 50% -8%, #2a1a10 0%, rgba(42,26,16,0) 62%),
        var(--bg);
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    padding: calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    max-width: 600px; margin: 0 auto; line-height: 1.5;
  }
  /* 进入前的模块选择 */
  #choose { display: flex; flex-direction: column; justify-content: center; min-height: 82vh; }
  .choose-title { text-align: center; font-size: 20px; font-weight: 750; margin: 0 0 4px; }
  .choose-sub { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 22px; }
  .choose-card {
    display: flex; align-items: center; gap: 16px; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow);
    color: var(--ink); font-size: 18px; font-weight: 700;
  }
  .choose-card .cc-emoji { font-size: 34px; line-height: 1; }
  .choose-card .cc-text { flex: 1; min-width: 0; }
  .choose-card .cc-text small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .choose-card .cc-arrow { color: var(--muted); font-size: 16px; }
  /* 登录页固定浅色，和之前保持一致 */
  body.gate-mode {
    --bg: #f4f6fb; --card: #ffffff; --ink: #101828; --muted: #667085;
    --line: #e6eaf2; --accent: #3b6bff; --accent-soft: #eaf0ff;
    --avatar-bg: #e6eaf2; --avatar-ink: #3b6bff;
    --header-bg: rgba(244,246,251,.9);
    color-scheme: light;
    background: #f4f6fb;
  }
  body.gate-mode .login-card { box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06); }
  .hidden { display: none !important; }

  /* ---------- 登录 ---------- */
  #gate { display: flex; flex-direction: column; justify-content: center; min-height: 78vh; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .logo { font-size: 46px; line-height: 1; }
  .brand h1 { font-size: 24px; margin: 10px 0 4px; letter-spacing: -.02em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0 16px; font-size: 13px; color: var(--muted); }
  .row input { width: 18px; height: 18px; accent-color: var(--accent); }
  button {
    width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit;
    font-size: 16px; font-weight: 600; color: #fff; background: var(--accent); cursor: pointer;
  }
  button:disabled { opacity: .6; }
  .err { color: #d92d20; font-size: 13px; min-height: 20px; margin-top: 10px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; }

  /* ---------- 主界面 ---------- */
  .bless-row { display: flex; align-items: center; gap: 8px; }
  .bless-row .bless { flex: 1; min-width: 0; }
  .edit-trigger {
    position: relative; flex: none; width: 34px; height: 32px; padding: 0;
    border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
    background: var(--accent-soft); color: var(--accent); font-size: 17px; line-height: 1;
  }
  .edit-trigger::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: var(--accent); opacity: .28;
    transform: scaleX(0); transform-origin: left; transition: transform 3s linear;
  }
  .edit-trigger.holding::after { transform: scaleX(1); }
  .edit-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent-soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 10px; margin-bottom: 10px;
  }
  .edit-bar .edit-label { font-size: 13px; font-weight: 700; color: var(--accent); }
  .edit-bar .edit-hint { flex: 1; font-size: 11px; color: var(--muted); }
  .mini.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mini.ghost { background: var(--card); color: var(--muted); }
  .mini.danger { background: transparent; color: #d92d20; border-color: #f3c7c2; }
  .edit-input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 14px; outline: none;
  }
  .edit-input:focus { border-color: var(--accent); }
  .name-input { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; }
  .ing-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .ing-row .ing-name { flex: 2; min-width: 0; }
  .ing-row .ing-qty { flex: 1; min-width: 0; }
  .cat-select {
    flex: none; width: 62px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 8px; padding: 7px 4px; font: inherit; font-size: 12px; outline: none;
  }
  .ing-del {
    flex: none; width: 26px; height: 28px; padding: 0; border-radius: 7px;
    background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 15px;
  }
  .add-ing { margin: 2px 0 12px; }
  .steps-area {
    width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: 14px; line-height: 1.6; outline: none;
  }
  .steps-area:focus { border-color: var(--accent); }
  .edit-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .edit-emoji { font-size: 20px; line-height: 1; }
  .edit-name { font-size: 15px; font-weight: 700; }
  .edit-sub { flex: 1; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edit-head .chev { color: var(--muted); font-size: 12px; flex: none; }
  .edit-body { margin-top: 12px; }
  .mini.danger.armed { background: #d92d20; color: #fff; border-color: #d92d20; }
  .edit-card h2 { font-size: 13px; font-weight: 650; color: var(--muted); margin: 12px 0 6px; }
  .add-recipe { width: 100%; margin: 12px 0 8px; }
  .top-fixed {
    position: sticky; top: 0; z-index: 40;
    margin: 0 -14px 8px;
    padding: calc(4px + env(safe-area-inset-top)) 14px 6px;
    background: var(--header-bg);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  header { padding: 0; }
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .who { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .hamburger {
    flex: none; width: 30px; height: 26px; padding: 5px; margin-right: 2px;
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
  }
  .hamburger span { display: block; height: 2px; border-radius: 2px; background: var(--muted); }
  .who { flex: 1; justify-content: center; }
  .when { flex: none; }
  .drawer { position: fixed; inset: 0; z-index: 90; }
  .drawer-mask {
    position: absolute; inset: 0; background: rgba(15,10,6,.42);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .drawer-panel {
    position: absolute; top: 0; left: 0; bottom: 0; width: min(76vw, 300px);
    background: var(--card); border-right: 1px solid var(--line);
    padding: calc(22px + env(safe-area-inset-top)) 14px 20px;
    box-shadow: 8px 0 30px rgba(0,0,0,.18); animation: slideIn .22s ease;
    display: flex; flex-direction: column; gap: 6px;
  }
  @keyframes slideIn { from { transform: translateX(-100%) } to { transform: none } }
  .drawer-title { font-size: 12px; color: var(--muted); margin: 4px 8px 8px; letter-spacing: .04em; }
  .drawer-item {
    width: 100%; text-align: left; background: transparent; color: var(--ink);
    border: 1px solid transparent; border-radius: 12px; padding: 12px;
    font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px;
  }
  .drawer-item .di { font-size: 18px; }
  .drawer-item.active { background: var(--accent-soft); color: var(--accent); }
  /* 汽车主题：参考仪表盘 —— 黑底 + 薄荷绿发光 */
  body.theme-car {
    --bg: #050a0c; --card: #0c1518; --ink: #e9f7f4; --muted: #7c9a96;
    --line: #1a2c2e; --accent: #2fe3c4; --accent-soft: rgba(47,227,196,.14);
    --ok: #2fe3c4; --header-bg: rgba(5,10,12,.92);
    --avatar-bg: rgba(47,227,196,.16); --avatar-ink: #2fe3c4;
    --shadow: 0 1px 2px rgba(0,0,0,.6), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
    background:
      radial-gradient(900px 320px at 50% -6%, rgba(47,227,196,.16) 0%, rgba(47,227,196,0) 60%),
      radial-gradient(700px 420px at 90% 110%, rgba(47,227,196,.08) 0%, rgba(47,227,196,0) 60%),
      var(--bg);
  }
  body.theme-car .car-stat {
    background: linear-gradient(180deg, rgba(47,227,196,.10), rgba(12,21,24,.9) 55%);
    border: 1px solid rgba(47,227,196,.28);
    box-shadow: 0 0 0 1px rgba(47,227,196,.06) inset, 0 0 22px rgba(47,227,196,.10);
  }
  body.theme-car .car-stat .num { color: #2fe3c4; text-shadow: 0 0 14px rgba(47,227,196,.55); }
  body.theme-car .car-stat .num small { color: rgba(47,227,196,.75); }
  body.theme-car .car-form { border-color: rgba(47,227,196,.18); }
  body.theme-car .car-form .submit {
    background: linear-gradient(180deg, #37f0cf, #16b89c); color: #04211d;
    box-shadow: 0 6px 20px rgba(47,227,196,.28);
  }
  body.theme-car .fuel-item { border-color: rgba(47,227,196,.16); }
  body.theme-car .fuel-item .fi-val b { color: #2fe3c4; }
  body.theme-car .group h3 { color: rgba(47,227,196,.7); }
  body.theme-car .tabs button.active { background: rgba(47,227,196,.14); color: #2fe3c4; }
  /* —— 仪表盘质感：渐变 + 发光 —— */
  body.theme-car .top-fixed::after {
    content: ""; position: absolute; left: 10%; right: 10%; bottom: 0; height: 2px;
    background: linear-gradient(90deg, rgba(47,227,196,0) 0%, rgba(47,227,196,.9) 50%, rgba(47,227,196,0) 100%);
    box-shadow: 0 0 12px rgba(47,227,196,.65);
    pointer-events: none;
  }
  body.theme-car .car-stat {
    background:
      linear-gradient(165deg, rgba(47,227,196,.22) 0%, rgba(16,28,32,.92) 42%, rgba(10,17,20,.98) 100%);
    border: 1px solid rgba(47,227,196,.22);
    box-shadow:
      inset 0 1px 0 rgba(180,255,240,.18),
      0 0 18px rgba(47,227,196,.10),
      0 10px 26px rgba(0,0,0,.45);
  }
  body.theme-car .car-stat .num {
    background: linear-gradient(180deg, #d9fff7 0%, #45f0d0 42%, #0fb59a 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(47,227,196,.45));
  }
  body.theme-car .car-stat .num small {
    -webkit-text-fill-color: rgba(47,227,196,.8); color: rgba(47,227,196,.8);
  }
  body.theme-car .car-form {
    background: linear-gradient(180deg, rgba(47,227,196,.06), rgba(12,21,24,.96) 40%);
    border: 1px solid rgba(47,227,196,.16);
    box-shadow: inset 0 1px 0 rgba(180,255,240,.08), 0 10px 26px rgba(0,0,0,.4);
  }
  body.theme-car .car-form .submit {
    background: linear-gradient(135deg, #5df7da 0%, #17c8a9 52%, #08917c 100%);
    color: #02231e;
    box-shadow: 0 8px 24px rgba(47,227,196,.32), inset 0 1px 0 rgba(255,255,255,.45);
  }
  body.theme-car .spend-total {
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(47,227,196,.22) 0%, rgba(47,227,196,0) 62%),
      linear-gradient(180deg, rgba(16,30,33,.95), rgba(8,14,16,.98));
    border: 1px solid rgba(47,227,196,.26);
    box-shadow: inset 0 1px 0 rgba(180,255,240,.16), 0 0 26px rgba(47,227,196,.14);
  }
  body.theme-car .spend-total .st-num {
    background: linear-gradient(180deg, #e6fffb 0%, #4ff2d4 45%, #0fae93 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(47,227,196,.5));
  }
  body.theme-car .subtabs button.active {
    background: linear-gradient(135deg, rgba(47,227,196,.28), rgba(47,227,196,.10));
    color: #7ff5e0;
    box-shadow: inset 0 1px 0 rgba(180,255,240,.25), 0 0 14px rgba(47,227,196,.18);
  }
  body.theme-car .fuel-item,
  body.theme-car .spend-item {
    background: linear-gradient(180deg, rgba(47,227,196,.05), rgba(10,17,20,.96) 60%);
  }
  /* 刻度条 + 扫光 */
  .gauge {
    position: relative; margin: 2px 0 14px; padding: 10px 12px 10px;
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, rgba(47,227,196,.10), rgba(10,17,20,.92) 70%);
    border: 1px solid rgba(47,227,196,.20);
    box-shadow: inset 0 1px 0 rgba(180,255,240,.10), 0 0 18px rgba(47,227,196,.08);
  }
  .gauge-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .gauge-top .gl { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .gauge-top .gv { font-size: 12px; color: #2fe3c4; font-weight: 700; text-shadow: 0 0 10px rgba(47,227,196,.45); }
  .gauge-track { position: relative; height: 12px; border-radius: 6px; background: rgba(47,227,196,.07); overflow: hidden; }
  .gauge-ticks {
    position: absolute; inset: 0; opacity: .55;
    background-image: repeating-linear-gradient(90deg, rgba(47,227,196,.55) 0 1px, transparent 1px 11px);
  }
  .gauge-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px;
    background: linear-gradient(90deg, rgba(47,227,196,.30), #2fe3c4 72%, #a8fff0);
    box-shadow: 0 0 14px rgba(47,227,196,.65);
    transition: width .95s cubic-bezier(.2,.9,.2,1);
  }
  .gauge-shine {
    position: absolute; top: 0; bottom: 0; width: 56px; left: -60px; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
    animation: sweep 1.2s ease-out .12s 1;
  }
  @keyframes sweep { from { left: -60px } to { left: 100% } }
  .gauge-scale { display: flex; justify-content: space-between; margin-top: 5px; font-size: 9px; color: rgba(47,227,196,.55); letter-spacing: .06em; }
  .car-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .car-grid.four { grid-template-columns: repeat(2, 1fr); }
  .car-grid.four .car-stat .num { font-size: 22px; }
  .odo-form { padding-bottom: 4px; }
  .car-stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 8px; text-align: center; box-shadow: var(--shadow);
  }
  .car-stat .num { font-size: 20px; font-weight: 750; letter-spacing: -.02em; }
  .car-stat .num small { font-size: 10px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .car-stat .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .car-form {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .form-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .form-head h2 { margin: 0; }
  .form-total {
    font-size: 12px; font-weight: 700; color: #2fe3c4;
    text-shadow: 0 0 10px rgba(47,227,196,.45);
  }
  .car-form h2 { font-size: 13px; color: var(--muted); margin: 0 0 4px; font-weight: 650; }
  .car-form .row2 { display: flex; gap: 8px; }
  .car-form .row2 > div { flex: 1; min-width: 0; }
  .car-form label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 4px; }
  .car-form input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; outline: none;
  }
  .car-form input:focus { border-color: var(--accent); }
  .car-form .submit { margin-top: 12px; padding: 12px; font-size: 15px; border-radius: 12px; }
  .fuel-item {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  }
  .fuel-item .fi-amt {
    font-size: 19px; font-weight: 800; letter-spacing: -.02em;
    color: #2fe3c4; text-align: center; padding: 0 6px;
    text-shadow: 0 0 12px rgba(47,227,196,.45);
  }
  .fuel-item .fi-right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .fuel-item .fi-main { flex: 1; min-width: 0; }
  .fuel-item .fi-date { font-size: 15px; font-weight: 650; }
  .fuel-item .fi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .fuel-item .fi-val { text-align: right; font-size: 11px; color: var(--muted); }

    <button class="mini ghost" id="btnCancelEdit" type="button">撤回</button>
    <button class="mini primary" id="btnSaveEdit" type="button">保存</button>
  </div>

  <nav class="tabs" id="tabs">
    <button id="tabRecipes" class="active" type="button">菜谱<span class="count soft" id="recipeCount"></span></button>
    <button id="tabShop" type="button">买菜清单<span class="count hidden" id="shopCount"></span></button>
  </nav>
  </div>

  <div class="drawer hidden" id="drawer">
    <div class="drawer-mask" id="drawerMask"></div>
    <aside class="drawer-panel">
      <div class="drawer-title">切换</div>
      <button class="drawer-item" type="button" data-module="kitchen"><span class="di">🍳</span> 烹饪</button>
      <button class="drawer-item" type="button" data-module="car"><span class="di">🚗</span> 汽车</button>
    </aside>
  </div>

  <main id="view"></main>

  <footer id="footer"></footer>
  <button class="logout" id="logout" type="button">退出登录</button>
</section>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  var KEY_CACHE = "mysite.key.v1";
  var KEY_USER = "mysite.user.v1";
  var SEL_KEY = "mysite.sel.v1";
  var CHK_KEY = "mysite.chk.v1";
  var CAT_ORDER = ["蔬菜", "肉蛋", "调料", "其他"];
  var CAT_EMOJI = { "蔬菜": "🥬", "肉蛋": "🥩", "调料": "🧂", "其他": "🛒" };
  var content = null;
  var currentTab = "recipes";
  var RECIPES_KEY = "mysite.recipes.v1";
  var PENDING_KEY = "mysite.pending.v1";
  var editing = false;
  var editOpen = -1;
  var openRecipe = null;
  var draft = null;
  var remoteRecipes = null;
  var remoteFuel = null;
  var remoteSpend = null;
  var SPEND_KEY = "mysite.spend.v1";
  var CAR_ODO_KEY = "mysite.carodo.v1";
  var AVG_KEY = "mysite.avg.v1";
  var remoteAvg = 0;
  var spendSort = "amountDesc";
  var remoteOdo = 0;
  var FUEL_KEY = "mysite.fuel.v1";
  var currentModule = "kitchen";
  var sessionKey = null;

  function recipes() {
    if (remoteRecipes && remoteRecipes.length) return remoteRecipes;
    var saved = loadJSON(RECIPES_KEY, null);
    if (saved && saved.length) return saved;
    return (content && content.recipes) ? content.recipes : [];
  }

  /* 从云端 data.json 读取菜谱（已用同一口令加密） */
  async function loadRemoteRecipes(key) {
    if (!sessionKey) sessionKey = key;
    var local = loadJSON(RECIPES_KEY, null);
    try {
      var res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      var d = await res.json();
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64bytes(d.iv) }, key, b64bytes(d.data));
      var obj = JSON.parse(new TextDecoder().decode(plain));
      if (!obj || !obj.recipes || !obj.recipes.length) return;

      // 只有"上次保存失败"留下的本机改动才优先；否则以云端为准，避免旧缓存覆盖云端
      var pending = loadJSON(PENDING_KEY, false);
      if (pending && local && local.length && JSON.stringify(local) !== JSON.stringify(obj.recipes)) {
        remoteRecipes = local;
        toast("检测到本机有未同步的改动，点保存即可上传");
        return;
      }
      remoteRecipes = obj.recipes;
      saveJSON(RECIPES_KEY, remoteRecipes);
      if (obj.avgOverride) {
        remoteAvg = Number(obj.avgOverride) || 0;
        saveJSON(AVG_KEY, remoteAvg);
      }
      if (obj.carOdo) {
        remoteOdo = Number(obj.carOdo) || 0;
        saveJSON(CAR_ODO_KEY, remoteOdo);
      }
      if (obj.spend && obj.spend.length) {
        remoteSpend = obj.spend;
        saveJSON(SPEND_KEY, remoteSpend);
      }
      if (obj.fuel && obj.fuel.length) {
        remoteFuel = obj.fuel;
        saveJSON(FUEL_KEY, remoteFuel);
      } else if (obj.fuel) {
        remoteFuel = [];
        saveJSON(FUEL_KEY, []);
      }
    } catch (e) {
      console.warn("remote recipes unavailable:", e);
    }
  }

  /* 把菜谱加密后写回 GitHub 仓库 */
  /* 带超时的 fetch：网络卡住时不会一直转圈 */
  function fetchTimeout(url, opts, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    var o = Object.assign({}, opts || {}, { signal: ctrl.signal });
    return fetch(url, o).then(function (r) { clearTimeout(timer); return r; },
      function (e) { clearTimeout(timer); throw e; });
  }

  async function pushData(dataObj) {
    var repo = content.editRepo;
    var token = content.editToken;
    if (!repo || !token) throw new Error("页面没有云端写入凭据");
    if (!sessionKey) throw new Error("会话密钥已失效，请重新登录");

    var iv = crypto.getRandomValues(new Uint8Array(12));
    var enc = new TextEncoder();
    var buf = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: iv },
      sessionKey,
      enc.encode(JSON.stringify(dataObj))
    );
    var payload = {
      v: 1, alg: "AES-256-GCM", iter: PAYLOAD.iter, salt: PAYLOAD.salt,
      iv: bytesB64(iv), data: bytesB64(buf)
    };
    var json = JSON.stringify(payload);

    var api = "https://api.github.com/repos/" + repo + "/contents/data.json";
    var auth = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };

    var sha = null;
    try {
      var got = await fetchTimeout(api + "?t=" + Date.now(), { headers: auth, cache: "no-store" }, 12000);
      if (got.ok) {
        var meta = await got.json();
        sha = meta.sha;
      }
    } catch (e) {
      throw new Error("连不上 GitHub（读取超时）");
    }

    var body = {
      message: "update recipes " + new Date().toISOString(),
      content: btoa(json),
      branch: "main"
    };
    if (sha) body.sha = sha;

    var res;
    try {
      res = await fetchTimeout(api, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
        body: JSON.stringify(body)
      }, 15000);
    } catch (e) {
      throw new Error("连不上 GitHub（上传超时）");
    }
    if (!res.ok) {
      var detail = "";
      try { detail = (await res.json()).message || ""; } catch (e) {}
      throw new Error("HTTP " + res.status + (detail ? " " + detail : ""));
    }
  }

  function startOdo() { return Number(content && content.carStartOdo) || 0; }

  function currentOdo() {
    var saved = remoteOdo || loadJSON(CAR_ODO_KEY, 0) || 0;
    var maxFuel = 0;
    fuelList().forEach(function (r) { if (Number(r.odo) > maxFuel) maxFuel = Number(r.odo); });
    return Math.max(saved, maxFuel);
  }

  function avgOverride() {
    return remoteAvg || loadJSON(AVG_KEY, 0) || 0;
  }

  async function syncAvg(v) {
    try {
      await pushData({ recipes: recipes(), fuel: fuelList(), spend: spendList(), carOdo: currentOdo(), avgOverride: v });
      toast("平均油耗已保存");
    } catch (e) {
      toast("云端保存失败：" + e.message + "（已存本机）");
    }
  }

  async function syncOdo(v) {
    try {
      await pushData({ recipes: recipes(), fuel: fuelList(), spend: spendList(), carOdo: v });
      toast("已保存到云端");
    } catch (e) {
      toast("云端保存失败：" + e.message + "（已存本机）");
    }
  }

  function fuelList() {
    if (remoteFuel && remoteFuel.length) return remoteFuel;
    var saved = loadJSON(FUEL_KEY, null);
    if (saved && saved.length) return saved;
    return [];
  }

  function pushRecipes(list) {
    return pushData({ recipes: list, fuel: fuelList(), spend: spendList(), carOdo: currentOdo(), avgOverride: avgOverride() });
  }

  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  /* ---------- 加解密 ---------- */
  function b64bytes(b64) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function bytesB64(bytes) {
    var s = "", a = new Uint8Array(bytes);
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  async function deriveKey(password) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64bytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
    );
  }
  async function decryptWith(key) {
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64bytes(PAYLOAD.iv) }, key, b64bytes(PAYLOAD.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function tryCached() {
    var cached = localStorage.getItem(KEY_CACHE);
    if (!cached) return false;
    try {
      var key = await crypto.subtle.importKey("raw", b64bytes(cached), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
      content = await decryptWith(key);
      await loadRemoteRecipes(key);
      startApp();
      return true;
    } catch (e) {
      localStorage.removeItem(KEY_CACHE);
      return false;
    }
  }

  /* ---------- 存储 ---------- */
  function loadJSON(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function selected() { return loadJSON(SEL_KEY, {}); }
  function checked() { return loadJSON(CHK_KEY, {}); }
  function selectedIds() {
    var s = selected(), out = [];
    (recipes() || []).forEach(function (r) { if (s[r.id]) out.push(r.id); });
    return out;
  }

  /* ---------- 界面 ---------- */
  function pickGreeting() {
    var h = new Date().getHours();
    if (h < 6) return "夜深了";
    if (h < 11) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }
  function todayText() {
    var d = new Date();
    var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 星期" + week;
  }

  function updateClock() {
    var d = new Date();
    var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    var hh = d.getHours(), mm = d.getMinutes();
    var el = document.getElementById("clock");
    if (!el) return;
    el.textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + week + " " +
      (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
  }

  function pickBlessing(c) {
    var list = (c.blessings && c.blessings.length) ? c.blessings : (c.blessing ? [c.blessing] : [""]);
    var last = parseInt(localStorage.getItem("mysite.bless.v1"), 10);
    var idx = Math.floor(Math.random() * list.length);
    if (list.length > 1 && idx === last) idx = (idx + 1) % list.length;
    try { localStorage.setItem("mysite.bless.v1", String(idx)); } catch (e) {}
    return list[idx];
  }

  function pickRandom(list, fallback) {
    if (!list || !list.length) return fallback || "";
    return list[Math.floor(Math.random() * list.length)];
  }

  var lastHeaderTab = null;
  function updateHeader() {
    var key = currentModule + ":" + currentTab;
    if (lastHeaderTab === key) return;
    lastHeaderTab = key;
    var helloEl = document.getElementById("hello");
    var blessEl = document.getElementById("bless");
    if (currentModule === "car") {
      helloEl.textContent = pickRandom(content.carTitles, "油耗记录");
      blessEl.textContent = pickRandom(content.carTips, "");
      return;
    }
    if (currentTab === "shop") {
      helloEl.textContent = pickRandom(content.shopTitles, "买菜时间");
      blessEl.textContent = pickRandom(content.shopTips, "");
    } else {
      helloEl.textContent = pickGreeting() + "，想吃点什么？";
      blessEl.textContent = pickBlessing(content);
    }
  }

  function startApp() {
    // 登录页只留登录框：进入后先隐藏它，弹出模块选择
    document.getElementById("gate").classList.add("hidden");
    document.body.classList.remove("gate-mode");
    document.body.classList.add("app-mode");
    document.getElementById("app").classList.add("hidden");
    document.getElementById("choose").classList.remove("hidden");
    document.title = "私人空间";
    var name = localStorage.getItem(KEY_USER) || "访客";
    document.getElementById("userName").textContent = name;
    document.getElementById("avatar").textContent = "🥢";
    updateClock();
    if (!startApp.clockTimer) startApp.clockTimer = setInterval(updateClock, 15000);
    window.scrollTo(0, 0);
  }

  function enterModule(m) {
    currentModule = m;
    saveJSON("mysite.module.v1", m);
    document.body.classList.toggle("theme-car", m === "car");
    document.getElementById("choose").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    lastHeaderTab = null;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    updateHeader();
    var carMode = (currentModule === "car");
    // 头像跟着模块换：烹饪 = 筷子，汽车 = 小汽车
    document.getElementById("avatar").textContent = carMode ? "🚗" : "🥢";
    document.getElementById("tabs").classList.toggle("hidden", carMode);
    document.getElementById("tabRecipes").classList.toggle("active", currentTab === "recipes");
    document.getElementById("tabShop").classList.toggle("active", currentTab === "shop");

    var n = selectedIds().length;
    var badge = document.getElementById("shopCount");
    badge.textContent = n ? String(n) : "";
    badge.classList.toggle("hidden", n === 0);

    var recipeBadge = document.getElementById("recipeCount");
    if (recipeBadge) {
      var total = recipes().length;
      recipeBadge.textContent = total ? String(total) : "";
      recipeBadge.classList.toggle("hidden", total === 0);
    }

    var view = document.getElementById("view");
    view.innerHTML = "";
    if (editing) { renderEditor(view); return; }
    if (carMode) { renderCar(view); return; }
    if (currentTab === "recipes") renderRecipes(view);
    else renderShop(view);
  }

  function renderRecipes(view) {
    var sel = selected();
    (recipes() || []).forEach(function (r) {
      var open = (openRecipe === r.id);
      var card = document.createElement("article");
      card.className = "recipe" + (open ? " open" : "");

      var head = document.createElement("div");
      head.className = "r-head";
      head.addEventListener("click", function () {
        openRecipe = open ? null : r.id;
        render();
      });

      var emoji = document.createElement("div");
      emoji.className = "r-emoji";
      emoji.textContent = r.emoji || "🍽";

      var title = document.createElement("div");
      title.className = "r-title";
      var h = document.createElement("h2"); h.textContent = r.name;
      var p = document.createElement("p"); p.textContent = r.meta || "";
      title.appendChild(h); title.appendChild(p);

      var chev = document.createElement("span");
      chev.className = "r-chev";
      chev.textContent = open ? "▾" : "▸";

      var btn = document.createElement("button");
      btn.className = "pick" + (sel[r.id] ? " on" : "");
      btn.type = "button";
      btn.textContent = sel[r.id] ? "已加入" : "加入清单";
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var s = selected();
        if (s[r.id]) delete s[r.id]; else s[r.id] = true;
        saveJSON(SEL_KEY, s);
        pruneChecks();
        render();
      });

      head.appendChild(emoji); head.appendChild(title); head.appendChild(chev); head.appendChild(btn);
      card.appendChild(head);

      if (open) {
        var body = document.createElement("div");
        body.className = "r-body";

        var h2 = document.createElement("h2");
        h2.textContent = "食材";
        body.appendChild(h2);

        var chips = document.createElement("div");
        chips.className = "chips";
        (r.ingredients || []).forEach(function (ing) {
          var c = document.createElement("span");
          c.className = "chip";
          c.textContent = ing.name + (ing.qty ? " " + ing.qty : "");
          chips.appendChild(c);
        });
        body.appendChild(chips);

        var h3 = document.createElement("h2");
        h3.textContent = "做法";
        body.appendChild(h3);

        var ol = document.createElement("ol");
        (r.steps || []).forEach(function (s) { var li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });
        body.appendChild(ol);

        card.appendChild(body);
      }

      view.appendChild(card);
    });
  }

  function shoppingList() {
    var sel = selected();
    var map = {};
    (recipes() || []).forEach(function (r) {
      if (!sel[r.id]) return;
      (r.ingredients || []).forEach(function (ing) {
        var key = (ing.cat || "其他") + "|" + ing.name;
        if (!map[key]) map[key] = { key: key, name: ing.name, cat: ing.cat || "其他", qtys: [] };
        if (ing.qty && map[key].qtys.indexOf(ing.qty) < 0) map[key].qtys.push(ing.qty);
      });
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  function pruneChecks() {
    var keys = {};
    shoppingList().forEach(function (it) { keys[it.key] = true; });
    var c = checked(), changed = false;
    Object.keys(c).forEach(function (k) { if (!keys[k]) { delete c[k]; changed = true; } });
    if (changed) saveJSON(CHK_KEY, c);
  }

  function removeRecipe(id) {
    var s = selected();
    delete s[id];
    saveJSON(SEL_KEY, s);
    pruneChecks();
    render();
  }

  function renderShop(view) {
    var items = shoppingList();
    var chk = checked();

    if (!items.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = "<p>清单还是空的<br>先去「菜谱」挑几道想吃的</p>";
      var go = document.createElement("button");
      go.type = "button"; go.textContent = "去挑菜";
      go.addEventListener("click", function () { currentTab = "recipes"; render(); });
      empty.appendChild(go);
      view.appendChild(empty);
      return;
    }

    // 今天做哪几道菜（点 × 可从清单里剔除）
    var sel = selected();
    var picked = (recipes() || []).filter(function (r) { return sel[r.id]; });
    if (picked.length) {
      var strip = document.createElement("div");
      strip.className = "picked";
      var lab = document.createElement("span");
      lab.className = "label";
      lab.textContent = "今天做";
      strip.appendChild(lab);
      picked.forEach(function (r) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "picked-chip";
        chip.appendChild(document.createTextNode((r.emoji || "🍽") + " " + r.name));
        var x = document.createElement("span");
        x.className = "x";
        x.textContent = "×";
        chip.appendChild(x);
        chip.addEventListener("click", function () { removeRecipe(r.id); });
        strip.appendChild(chip);
      });
      view.appendChild(strip);
    }

    var bought = items.filter(function (it) { return chk[it.key]; }).length;

    var bar = document.createElement("div");
    bar.className = "summary-bar";
    var prog = document.createElement("div");
    prog.className = "progress";
    var fill = document.createElement("i");
    fill.style.width = Math.round((bought / items.length) * 100) + "%";
    prog.appendChild(fill);
    bar.appendChild(prog);

    var row = document.createElement("div");
    row.className = "summary-row";
    var txt = document.createElement("span");
    txt.innerHTML = "已买 <b>" + bought + "</b> / " + items.length;
    var actions = document.createElement("span");

    var copy = document.createElement("button");
    copy.className = "mini"; copy.type = "button"; copy.textContent = "复制清单";
    copy.addEventListener("click", function () {
      var lines = [];
      ["蔬菜", "肉蛋", "调料", "其他"].forEach(function (cat) {
        var group = items.filter(function (it) { return it.cat === cat; });
        if (!group.length) return;
        lines.push("【" + cat + "】");
        group.forEach(function (it) { lines.push((chk[it.key] ? "✓ " : "□ ") + it.name + " " + (it.qtys.join("、") || "")); });
      });
      var text = lines.join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          copy.textContent = "已复制";
          setTimeout(function () { copy.textContent = "复制清单"; }, 1500);
        });
      }
    });
    actions.appendChild(copy);

    var reset = document.createElement("button");
    reset.className = "mini"; reset.type = "button"; reset.textContent = "清空勾选";
    reset.style.marginLeft = "6px";
    reset.addEventListener("click", function () { saveJSON(CHK_KEY, {}); render(); });
    actions.appendChild(reset);

    row.appendChild(txt); row.appendChild(actions);
    bar.appendChild(row);
    view.appendChild(bar);

    CAT_ORDER.concat(["其他"]).forEach(function (cat) {
      var group = items.filter(function (it) { return it.cat === cat; });
      if (!group.length) return;
      var g = document.createElement("div");
      g.className = "group";
      var h3 = document.createElement("h3");
      h3.textContent = (CAT_EMOJI[cat] || "") + " " + cat;
      g.appendChild(h3);

      group.forEach(function (it) {
        var label = document.createElement("label");
        label.className = "item" + (chk[it.key] ? " done" : "");

        var box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!chk[it.key];
        box.addEventListener("change", function () {
          var c = checked();
          if (box.checked) c[it.key] = true; else delete c[it.key];
          saveJSON(CHK_KEY, c);
          render();
        });

        var name = document.createElement("span");
        name.className = "name"; name.textContent = it.name;

        var qty = document.createElement("span");
        qty.className = "qty"; qty.textContent = it.qtys.join("、");

    var mask = document.createElement("div");
    mask.className = "modal-mask";

    var box = document.createElement("div");
    box.className = "modal";

    desc.innerHTML = parts.length
      ? "将清空选中的 " + parts.join("和") + "，清空后不可恢复。"
      : "当前还没有选菜谱或勾选食材，确定要清空吗？";

    var ok = document.createElement("button");
    ok.type = "button";
    ok.className = "modal-ok";
    ok.textContent = "确定完成";

    cancel.addEventListener("click", function (ev) { ev.stopPropagation(); close(); });
    ok.addEventListener("click", function (ev) {
      ev.stopPropagation();
      saveJSON(SEL_KEY, {});
      saveJSON(CHK_KEY, {});
      close();
      render();
    });
    mask.addEventListener("click", function (ev) { if (ev.target === mask) close(); });
    document.addEventListener("keydown", onKey);

    function onKey(ev) { if (ev.key === "Escape") close(); }
    function close() {
      document.removeEventListener("keydown", onKey);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
    }

    acts.appendChild(cancel);
    acts.appendChild(ok);
    box.appendChild(title);
    box.appendChild(desc);
    box.appendChild(acts);
    mask.appendChild(box);
    document.body.appendChild(mask);
    ok.focus();
  }

  async function saveEdits() {
    var clean = [];
    (draft || []).forEach(function (r) {
      var nm = (r.name || "").trim();
      if (!nm) return;
      clean.push({
        id: r.id || ("r" + Math.random().toString(36).slice(2, 8)),
        name: nm,
        emoji: r.emoji || "🍽",
        meta: r.meta || "",
        ingredients: (r.ingredients || []).filter(function (i) { return (i.name || "").trim(); }),
        steps: (r.steps || []).filter(function (s) { return s; })
      });
    });
    if (!clean.length) { toast("至少要留一道有名字的菜"); return; }

    var btn = document.getElementById("btnSaveEdit");
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "保存中…";
    remoteRecipes = clean;
    saveJSON(RECIPES_KEY, clean);
    try {
      await pushRecipes(clean);
      saveJSON(PENDING_KEY, false);
      toast("已保存到云端，其他设备约 1 分钟后可见");
      exitEditMode();
      render();
      return;
    } catch (e) {
      saveJSON(PENDING_KEY, true);
      toast("保存失败：" + e.message + "（改动已存本机，可再点一次保存重试）");
    } finally {
      // 无论成功失败都恢复按钮，避免卡在"保存中"
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  function wireEditTrigger() {
    var el = document.getElementById("editTrigger");
    if (!el) return;
    var timer = null;
    function start(ev) {
      if (editing) return;
      ev.preventDefault();
      el.classList.add("holding");
      timer = setTimeout(function () {
        el.classList.remove("holding");
        enterEditMode();
      }, 3000);
    }
    function stop() {
      clearTimeout(timer);
      el.classList.remove("holding");
    }
    el.addEventListener("pointerdown", start);

  function fuelRecords() {
    var list = fuelList().slice();
    list.sort(function (a, b) { return (Number(a.odo) || 0) - (Number(b.odo) || 0); });
    return list;
  }

  function fuelStats() {
    var all = fuelList();
    var withOdo = all.filter(function (r) { return Number(r.odo) > 0; })
      .sort(function (a, b) { return a.odo - b.odo; });
    var totalOdo = 0, dist = 0, avg = null;
    if (withOdo.length) {
      totalOdo = withOdo[withOdo.length - 1].odo;
      dist = totalOdo - withOdo[0].odo;
      var liters = 0;
      for (var i = 1; i < withOdo.length; i++) liters += Number(withOdo[i].liters) || 0;
      avg = dist > 0 ? (liters / dist * 100) : null;
    }
    var cost = all.reduce(function (s, r) {
      var v = (r.amount !== undefined && r.amount !== null) ? r.amount : r.price;
      return s + (Number(v) || 0);
    }, 0);
    var ov = avgOverride();
    return { total: totalOdo, dist: dist, avg: ov ? ov : avg, cost: cost, count: all.length };
  }

    view.appendChild(g);

    all.forEach(function (rec) {
      var amount = Number(rec.amount !== undefined && rec.amount !== null ? rec.amount : rec.price) || 0;
      var odo = Number(rec.odo) || 0;
      var liters = Number(rec.liters) || 0;

      var dist = 0, cons = null;
      if (odo && liters) {
        var idx = -1;
        for (var i = 0; i < withOdo.length; i++) { if (withOdo[i].id === rec.id) { idx = i; break; } }
        if (idx > 0) {
          dist = odo - withOdo[idx - 1].odo;
          cons = dist > 0 ? (liters / dist * 100) : null;
        }
      }

      var item = document.createElement("div");
      item.className = "fuel-item";

      var main = document.createElement("div");
      main.className = "fi-main";
      var dt = document.createElement("div");
      dt.className = "fi-date";
      dt.textContent = rec.date + (rec.station ? " · " + rec.station : "");
      var sub = document.createElement("div");
      sub.className = "fi-sub";
      var bits = [];
      if (liters) bits.push(liters + " L");
      if (odo) bits.push(odo.toLocaleString() + " km");
      if (dist > 0) bits.push("跑 " + dist + " km");
      sub.textContent = bits.join(" · ");
      main.appendChild(dt); main.appendChild(sub);

      var amt = document.createElement("div");
      amt.className = "fi-amt";
      amt.textContent = "¥" + amount.toLocaleString();

      var val = document.createElement("div");
      val.className = "fi-val";
      var b = document.createElement("b");
      b.textContent = cons ? cons.toFixed(1) : "—";
      val.appendChild(b);
      val.appendChild(document.createTextNode(" L/100km"));

      var del = document.createElement("button");
      del.type = "button";
      del.className = "fuel-del";
      del.textContent = "×";
      var armed = false, timer = null;
      del.addEventListener("click", function () {
        if (!armed) {
          armed = true;
          del.classList.add("armed");
          del.textContent = "确认";
          timer = setTimeout(function () {
            armed = false; del.classList.remove("armed"); del.textContent = "×";
          }, 3000);
          return;
        }
        clearTimeout(timer);
        var next = fuelList().filter(function (x) { return x.id !== rec.id; });
        remoteFuel = next;
        saveJSON(FUEL_KEY, next);
        render();
        syncFuel(next);
      });

      var right = document.createElement("div");
      right.className = "fi-right";
      right.appendChild(val);
      right.appendChild(del);

      item.appendChild(main);
      item.appendChild(amt);
      item.appendChild(right);
      view.appendChild(item);
    });
  }

  function renderSpend(view) {
    var fuelCost = fuelStats().cost;
    var total = spendTotal() + fuelCost;
    var cats = spendByCat();
    if (fuelCost) cats["油费"] = fuelCost;

    var card = document.createElement("div");
    card.className = "spend-total";
    var lbl = document.createElement("div");
    lbl.className = "st-lbl";
    lbl.textContent = "用车总投入";
    var num = document.createElement("div");
    num.className = "st-num";
    num.textContent = "¥" + total.toLocaleString();
    var sub = document.createElement("div");
    sub.className = "st-sub";
    sub.textContent = spendList().length + " 笔";
    card.appendChild(lbl); card.appendChild(num); card.appendChild(sub);
    view.appendChild(card);

    var chips = document.createElement("div");
    chips.className = "spend-chips";
    ["油费", "购车", "保险", "保养", "用品", "清洁", "洗车", "其他"].forEach(function (c) {
      if (!cats[c]) return;
      var s = document.createElement("span");
      s.className = "spend-chip";
      s.textContent = c + " " + cats[c].toLocaleString();
      chips.appendChild(s);
    });
    view.appendChild(chips);

    var form = document.createElement("div");
    form.className = "car-form";
    var h = document.createElement("h2");
    h.textContent = "新增支出";
    form.appendChild(h);

    var row = document.createElement("div");
    row.className = "row2";
    var c1 = document.createElement("div");
    var l1 = document.createElement("label"); l1.textContent = "项目";
    var nameIn = document.createElement("input");
    nameIn.type = "text"; nameIn.placeholder = "如 洗车";
    c1.appendChild(l1); c1.appendChild(nameIn);

    var c2 = document.createElement("div");
    var l2 = document.createElement("label"); l2.textContent = "金额 (元)";
    var amtIn = document.createElement("input");
    amtIn.type = "number"; amtIn.inputMode = "decimal"; amtIn.step = "0.01"; amtIn.placeholder = "如 30";
    c2.appendChild(l2); c2.appendChild(amtIn);
    row.appendChild(c1); row.appendChild(c2);
    form.appendChild(row);

    var row3 = document.createElement("div");
    var l3 = document.createElement("label"); l3.textContent = "分类";
    var catSel = document.createElement("select");
    catSel.className = "cat-select";
    catSel.style.width = "100%";
    ["购车", "保险", "保养", "用品", "清洁", "洗车", "其他"].forEach(function (c) {
      var o = document.createElement("option");
      o.value = c; o.textContent = c;
      catSel.appendChild(o);
    });
    row3.appendChild(l3); row3.appendChild(catSel);
    form.appendChild(row3);

    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "submit";
    addBtn.textContent = "添加";
    addBtn.addEventListener("click", function () {
      var nm = (nameIn.value || "").trim();
      var amt = parseFloat(amtIn.value);
      if (!nm) { toast("请填项目名"); return; }
      if (!amt || amt <= 0) { toast("请填金额"); return; }
      var rec = { id: "s" + Date.now(), name: nm, amount: amt, cat: catSel.value };
      var next = spendList().concat([rec]);
      remoteSpend = next;
      saveJSON(SPEND_KEY, next);
      render();
      syncSpend(next);
    });
    form.appendChild(addBtn);
    view.appendChild(form);

    var list = spendList().map(function (x, i) {
      return { id: x.id, name: x.name, amount: Number(x.amount) || 0, cat: x.cat || "其他", synthetic: false, idx: i };
    });
    if (fuelCost) {
      list.push({ id: "__fuel__", name: "加油总花费", amount: fuelCost, cat: "油费", synthetic: true, idx: 1e9 });
    }
    if (spendSort === "amountAsc") {
      list.sort(function (a, b) { return a.amount - b.amount; });
    } else if (spendSort === "dateDesc") {
      list.sort(function (a, b) { return b.idx - a.idx; });
    } else {
      list.sort(function (a, b) { return b.amount - a.amount; });
    }

    var g = document.createElement("div");
    g.className = "group list-head";
    var h3 = document.createElement("h3");
    h3.textContent = "账本明细";

    var sortSel = document.createElement("select");
    sortSel.className = "sort-select";
    [["amountDesc", "金额 大→小"], ["amountAsc", "金额 小→大"], ["dateDesc", "最近添加"]].forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o[0];
      opt.textContent = o[1];
      sortSel.appendChild(opt);
    });
    sortSel.value = spendSort;
    sortSel.addEventListener("change", function () {
      spendSort = sortSel.value;
      render();
    });

    g.appendChild(h3);
    g.appendChild(sortSel);
    view.appendChild(g);

    list.forEach(function (rec) {
      var item = document.createElement("div");
      item.className = "spend-item";
      var main = document.createElement("div");
      main.className = "si-main";
      var nm = document.createElement("div");
      nm.className = "si-name";
      nm.textContent = rec.name;
      var cat = document.createElement("div");
      cat.className = "si-cat";
      cat.textContent = rec.cat || "其他";
      main.appendChild(nm); main.appendChild(cat);

      var amt = document.createElement("div");
      amt.className = "si-amt";
      amt.textContent = "¥" + Number(rec.amount).toLocaleString();

      var del = document.createElement("button");
      del.type = "button";
      del.className = "fuel-del";
      del.textContent = "×";
      var armed = false, timer = null;
      if (rec.synthetic) {
        del.style.visibility = "hidden";
        del.disabled = true;
      }
      del.addEventListener("click", function () {
        if (rec.synthetic) return;
        if (!armed) {
          armed = true; del.classList.add("armed"); del.textContent = "确认";
          timer = setTimeout(function () { armed = false; del.classList.remove("armed"); del.textContent = "×"; }, 3000);
          return;
        }
        clearTimeout(timer);
        var next = spendList().filter(function (x) { return x.id !== rec.id; });
        remoteSpend = next;
        saveJSON(SPEND_KEY, next);
        render();
        syncSpend(next);
      });

      item.appendChild(main); item.appendChild(amt); item.appendChild(del);
      view.appendChild(item);
    });
  }
  function openDrawer() {
    var d = document.getElementById("drawer");
    d.classList.remove("hidden");
    Array.prototype.forEach.call(d.querySelectorAll(".drawer-item"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-module") === currentModule);
    });
  }
  function closeDrawer() {
    document.getElementById("drawer").classList.add("hidden");
  }
  function switchModule(m) {
    if (editing) return;
    currentModule = m;
    saveJSON("mysite.module.v1", m);
    document.body.classList.toggle("theme-car", m === "car");
    lastHeaderTab = null;
    closeDrawer();
    render();
  }

  /* ---------- 事件 ---------- */
  document.getElementById("btnSaveEdit").addEventListener("click", saveEdits);
  document.getElementById("btnCancelEdit").addEventListener("click", cancelEdits);
  wireEditTrigger();
  Array.prototype.forEach.call(document.querySelectorAll(".choose-card"), function (b) {
    b.addEventListener("click", function () { enterModule(b.getAttribute("data-module")); });
  });
  document.getElementById("menuBtn").addEventListener("click", openDrawer);
  document.getElementById("drawerMask").addEventListener("click", closeDrawer);
  Array.prototype.forEach.call(document.querySelectorAll(".drawer-item"), function (b) {
    b.addEventListener("click", function () { switchModule(b.getAttribute("data-module")); });
  });
  document.getElementById("tabRecipes").addEventListener("click", function () { currentTab = "recipes"; render(); });
  document.getElementById("tabShop").addEventListener("click", function () { currentTab = "shop"; render(); });

  document.getElementById("loginForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("submitBtn");
    var err = document.getElementById("err");
    var user = document.getElementById("user").value.trim();
    var pass = document.getElementById("pass").value;
    if (!pass) { err.textContent = "请输入口令"; return; }
    err.textContent = "";
    btn.disabled = true; btn.textContent = "验证中…";
    if (user) localStorage.setItem(KEY_USER, user);
    try {
      var key = await deriveKey(pass);
      content = await decryptWith(key);
      await loadRemoteRecipes(key);
      if (document.getElementById("remember").checked) {
        try {
          var raw = await crypto.subtle.exportKey("raw", key);
          localStorage.setItem(KEY_CACHE, bytesB64(raw));
        } catch (e) {}
      }
      startApp();
    } catch (e) {
      err.textContent = "口令不对，或页面已更新，请重试。";
      localStorage.removeItem(KEY_CACHE);
    } finally {
      btn.disabled = false; btn.textContent = "进入";
    }
  });

  document.getElementById("logout").addEventListener("click", function () {
    localStorage.removeItem(KEY_CACHE);
    location.reload();
  });

  document.getElementById("user").value = localStorage.getItem(KEY_USER) || "";
  if (localStorage.getItem(KEY_CACHE)) document.getElementById("gate").classList.add("hidden");
  tryCached().then(function (ok) { if (!ok) document.getElementById("gate").classList.remove("hidden"); });
})();
</script>
</body>
</html>
